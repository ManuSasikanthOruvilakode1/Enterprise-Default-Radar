name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest tests --cov=src --cov-report=term

      - name: Batch scoring smoke test
        run: |
          uv run python - <<'EOF'
          from src.data_generation import generate_business_dataset
          generate_business_dataset(50, seed=1).to_csv("smoke_input.csv", index=False)
          EOF
          uv run python scripts/run_pipeline.py --config tests/ci_config.yaml --output-dir ci_output
          uv run python scripts/score_csv.py smoke_input.csv --model ci_output/models/risk_model.joblib
