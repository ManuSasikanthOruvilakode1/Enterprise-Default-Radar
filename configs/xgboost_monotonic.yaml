# Default XGBoost settings plus monotonic constraints (no tuning).
model_type: xgboost
role: candidate
params:
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 5
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 3.0
  eval_metric: "logloss"
  n_jobs: 1
  random_state: 42
# Domain knowledge: risk can only rise with leverage and only fall with liquidity, margin and firm age.
monotonic_constraints:
  debt_to_equity_ratio: 1
  leverage_liquidity_ratio: 1
  current_ratio: -1
  profit_margin: -1
  years_operating: -1
